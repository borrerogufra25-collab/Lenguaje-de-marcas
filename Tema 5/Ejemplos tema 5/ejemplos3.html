<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 85%;
      margin: 0 auto;
    }

    main {
      transform-style: preserve-3d;
      perspective: 500px;
    }

    header h1 {
      text-align: center;
    }

    main section {
      width: 200px;
      border-radius: 50px;
      height: 200px;
      padding: 50px;
      padding-top: 70px;
      background-color: yellowgreen;
      font-size: 25px;
      transition: transform 0.5s;
    }

    main section:hover {
      /* transform: translate(50px); */
      transform: rotatey(360deg);
      /*  transform: scale(1.5);*/
      /* transform: scalex(1.5); */
      /* transform: skew(10deg); */
    }
  </style>
</head>

<body>
  <header>
    <h1>El titulo</h1>
  </header>

  <main>
    <section>Una caja cualquiera</section>
  </main>
</body>

</html>
