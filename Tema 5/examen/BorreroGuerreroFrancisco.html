<!DOCTYPE html>
<html lang="es">

<head>
	<title>PC Regalo</title>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<style type="text/css">
		/*NO TOCAR ESTOS ESTILOS*/
		body {
			margin: 0px;
		}

		a {
			text-decoration: none;
		}

		nav {
			position: fixed;
			top: 0px;
			width: 100%;
			display: flex;
			justify-content: space-between;
		}

		nav>div {
			flex: 0 0 50%;
			background-color: lightblue;
			display: flex;
		}

		nav li,
		nav i {
			background-color: lightblue;
			color: #0762f4;
			list-style-type: none;
			font-size: 16pt;
			font-family: Arial;
			text-align: center;
			flex: 0 0 180px;
			height: 25px;
			padding: 38px 10px 35px 10px;
		}

		nav>div.dcha {
			justify-content: flex-end;
		}

		nav>div.izq>li:hover {
			color: white;
			background-color: #023484;
		}

		nav>div.dcha>i {
			flex-basis: 80px;
			font-size: 2.5em;
			text-align: left;
			padding-top: 25px;
		}

		div#content {
			position: fixed;
			top: 98px;
			width: 100%;
			height: 1200px;

		}

		/*FIN DE ESTILOS QUE NO DEBES TOCAR*/
		/*ESTILOS PARA EL EJERCICIO 1*/

		aside {
			float: left;
			background-color: lightblue;
			width: 20%;
			height: 800px;
			font-family: Arial;
			font-size: 16pt;
			color: #0762f4;
		}

		aside a li:hover {
			color: white;
			background-color: #023484;
		}

		/*FIN ESTILOS PARA EL EJERCICIO 1*/

		/*ESTILOS PARA EL EJERCICIO 2*/

		main {
			width: 80%;
		}

		main section {
			display: none;
		}

		main section:target {
			display: block;
			animation: animacionFotosEntrada 1s reverse;
		}

		@keyframes animacionFotosEntrada {
			0% {
				transform: translateX(0px) translateY(0px);
			}

			100% {
				transform: translateX(900px) translateY(800px);
			}
		}

		/*FIN ESTILOS PARA EL EJERCICIO 2*/

		/*ESTILOS PARA EL EJERCICIO 3*/

		@keyframes llamada {
			0% {
				transform: rotate(0deg);
			}

			33% {
				transform: rotate(5deg);
			}

			66% {
				transform: rotate(-5deg);
			}

			100% {
				transform: rotate(0deg);
			}
		}

		nav div li:hover+i {
			animation: llamada 0.2s infinite linear;
		}

		/*FIN ESTILOS PARA EL EJERCICIO 3*/

		/*ESTILOS PARA EL EJERCICIO 4 (añade lo que necesites)*/
		nav>div.izq>div#logo {
			background-image: url('img/logo.png');
			background-repeat: no-repeat;
			flex: 0 0 155px;
		}

		/*FIN ESTILOS PARA EL EJERCICIO 4*/
	</style>
</head>

<body>
	<!--CÓDIGO PARA LOS EJERCICOS 3 y 4. NO TOQUES ESTE CÓDIGO. NO PUEDES AÑADIR NADA, NI SIQUIERA CLASES NI IDS-->
	<nav>
		<div class="izq">
			<div id="logo"></div>
			<li>INICIO</li>
		</div>
		<div class="dcha">
			<li>Contacto</li>
			<i class="bi bi-phone-vibrate"></i>

		</div>
	</nav>
	<!-- CÓDIGO PARA LOS EJERCICIOS 1 y 2. NO PUEDES AÑADIR ETIQUETAS NUEVAS, SOLO PUEDES AÑADIR CLASES O IDS. TAMBIÉN PUEDES EDITAR LAS RUTAS DE LOS ENLACES DEL ASIDE-->
	<div id="content">
		<aside>
			<a href="#Ordenadores">
				<li>Ordenadores</li>
			</a>
			<a href="#Periféricos">
				<li>Periféricos</li>
			</a>
			<a href="#Monitores">
				<li>Monitores</li>
			</a>
			<a href="#Gaming">
				<li>Gaming</li>
			</a>
			<a href="#Redes">
				<li>Redes</li>
			</a>
			<a href="#Impresoras">
				<li>Impresoras</li>
			</a>
		</aside>
		<main>
			<section id="Ordenadores" class="animacionFotosEntrada
			">
				<img src="img/ordenadores.png">
			</section>
			<section id="Periféricos" class="animacionFotosEntrada
			">
				<img src="img/perifericos.png">
			</section>
			<section id="Monitores" class="animacionFotosEntrada
			">
				<img src="img/monitores.png">
			</section>
			<section id="Gaming" class="animacionFotosEntrada
			">
				<img src="img/gaming.png">
			</section>
			<section id="Redes" class="animacionFotosEntrada
			">
				<img src="img/redes.png">
			</section>
			<section id="Impresoras" class="animacionFotosEntrada
			">
				<img src="img/impresoras.png">
			</section>
		</main>
	</div>
</body>

</html>
