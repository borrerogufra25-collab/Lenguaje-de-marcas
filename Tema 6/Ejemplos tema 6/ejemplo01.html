<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera tabla</title>

    <style>
        * {
            box-sizing: border-box;
        }

        table {
            border: 2px solid red;
            border-collapse: collapse;
            /*Te junta los bordes si estan juntos*/
            margin: auto;
            caption-side: bottom;
        }

        td {
            width: 100px;
            height: 40px;
            text-align: center;
            vertical-align: bottom;
            padding: 2px;
            border: 1px solid black;
        }

        tr:first-child th {
            background-color: fuchsia;
        }

        tr:nth-child(odd) td,
        tr:nth-child(even) th {
            background-color: yellow;
        }
    </style>

</head>

<body>

    <h1>El tiempo</h1>
    <table summary="Esto no aparece pero dice de que va la tabla">
        <caption>Previsión de 7 días</caption>
        <tr>
            <th>Día</th>
            <th>18/3</th>
            <th>19/3</th>
            <th>20/3</th>
            <th>21/3</th>
            <th>22/3</th>
            <th>23/3</th>
            <th>24/3</th>
        </tr>

        <tr>
            <th>Temperatura</th>
            <td>26º</td>
            <td>25º</td>
            <td>26º</td>
            <td>25º</td>
            <td>26º</td>
            <td>25º</td>
            <td>26º</td>
        </tr>

        <tr>
            <th rowspan="2">% Lluvia</th>
            <td>5%</td>
            <td>12%</td>
            <td>63%</td>
            <td>12%</td>
            <td>72%</td>
            <td>81%</td>
            <td>5%</td>
        </tr>

        <tr>
            <td>Soleado</td>
            <td>Claros y nubes</td>
            <td>Soleado</td>
            <td>Nublado</td>
            <td colspan="2">Lluvia</td>
            <td>Soleado</td>
        </tr>
    </table>

</body>

</html>
