<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejemplo Tablas y Formularios</title>

    <style>
        /* ======== ESTILOS DE TABLA ======== */

        /* Estilo general de la tabla */
        table {
            width: 500px;
            /* Ancho fijo */
            border: 2px solid black;
            /* Borde exterior */
            border-collapse: collapse;
            /* Une los bordes */
            margin: 20px auto;
            /* Centrada */
            caption-side: top;
            /* Título arriba */
        }

        /* Estilo para celdas y encabezados */
        th,
        td {
            border: 1px solid black;
            /* Bordes internos */
            padding: 8px;
            /* Espaciado interno */
            text-align: center;
            /* Centrado del texto */
        }

        /* Encabezado de la tabla */
        thead {
            background-color: #333;
            color: white;
        }

        /* Filas pares del cuerpo */
        tbody tr:nth-child(even) {
            background-color: #e3f2fd;
        }

        /* Filas impares del cuerpo */
        tbody tr:nth-child(odd) {
            background-color: #bbdefb;
        }

        /* Pie de tabla */
        tfoot {
            background-color: #ddd;
            font-style: italic;
        }

        tr:nth-child(even) td:hover {
            background-color: fuchsia;
        }

        tr:nth-child(odd) td:hover {
            background-color: seagreen;
        }

        tr:hover th:first-child {
            background-color: purple;
        }

        /* ======== ESTILOS DEL FORMULARIO ======== */

        /* Contenedor del formulario */
        form {
            width: 400px;
            margin: 40px auto;
            /* Centrado */
            padding: 20px;
            border: 2px solid #444;
            border-radius: 10px;
            background: #f5f5f5;
        }

        /* Agrupación de campos */
        fieldset {
            border: 1px solid #333;
            padding: 15px;
            margin-bottom: 20px;
        }

        /* Título del fieldset */
        legend {
            font-weight: bold;
        }

        /* Etiquetas de los campos */
        label {
            display: block;
            /* Cada etiqueta en una línea */
            margin-top: 10px;
            font-weight: bold;
        }

        /* Inputs, selects y textarea */
        input,
        select,
        textarea {
            width: 95%;
            /* Ocupan casi todo el ancho */
            padding: 6px;
            margin-top: 5px;
        }

        /* Botones */
        input[type="submit"],
        input[type="reset"] {
            width: 48%;
            /* Dos botones lado a lado */
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1 style="text-align:center;">Ejemplo de Tabla y Formulario</h1>

    <!-- ================= TABLA ================= -->
    <!-- Tabla con información de canciones. summary es como
      el alt en las imagenes, para poner descripciones-->
    <table summary="Tabla de canciones con puntuación">
        <caption><strong>Clasificación de Canciones</strong></caption>

        <thead>
            <tr>
                <th>Canción</th>
                <th>Autor</th>
                <th>Puntuación</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Malamente</td>
                <td>Rosalía</td>
                <td>2</td>
            </tr>

            <!-- Ejemplo de celda que ocupa dos filas -->
            <tr>
                <td rowspan="2">En Un Mercedes Blanco</td>
                <td>Kiko Veneno</td>
                <td>10</td>
            </tr>
            <tr>
                <td>10</td>
            </tr>

            <tr>
                <td>La noche de anoche</td>
                <td>Bad Bunny</td>
                <td>0</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Tabla elaborada como ejemplo del temario</td>
            </tr>
        </tfoot>
    </table>

    <!-- ================= FORMULARIO ================= -->
    <!-- Formulario de ejemplo con datos personales y preferencias -->
    <form action="#" method="POST" autocomplete="on">

        <fieldset>
            <legend>Datos personales</legend>

            <!-- Campo de texto -->
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Escribe tu nombre">

            <!-- Campo numérico -->
            <label for="edad">Edad</label>
            <input type="number" id="edad" name="edad" min="0" max="99" step="1">

            <!-- Fecha -->
            <label for="fnac">Fecha de nacimiento</label>
            <input type="date" id="fnac" name="fnac" min="1900-01-01" max="2025-12-31">
        </fieldset>

        <fieldset>
            <legend>Preferencias</legend>

            <!-- Botones de opción -->
            <label>Género</label>
            <input type="radio" name="genero" value="M"> Masculino
            <input type="radio" name="genero" value="F"> Femenino
            <input type="radio" name="genero" value="O"> Otro

            <!-- Lista desplegable -->
            <label for="prov">Provincia</label>
            <select id="prov" name="prov">
                <option value="SE">Sevilla</option>
                <option value="CA">Cádiz</option>
                <option value="HU">Huelva</option>
            </select>

            <!-- Área de texto -->
            <label for="coment">Comentarios</label>
            <textarea id="coment" name="coment" rows="4">Escribe algo...</textarea>
        </fieldset>

        <!-- Botones del formulario -->
        <input type="submit" value="Enviar">
        <input type="reset" value="Borrar">
    </form>

</body>

</html>
