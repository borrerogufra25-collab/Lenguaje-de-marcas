<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejemplo Tablas y Formularios</title>

    <style>
        /* ======== ESTILOS DE TABLA ======== */

        table {
            width: 500px;
            border: 2px solid black;
            border-collapse: collapse;
            margin: 20px auto;
            caption-side: top;
        }

        th,
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }

        thead {
            background-color: #333;
            color: white;
        }

        tbody tr:nth-child(even) {
            background-color: #e3f2fd;
        }

        tbody tr:nth-child(odd) {
            background-color: #bbdefb;
        }

        tfoot {
            background-color: #ddd;
            font-style: italic;
        }

        tr:nth-child(even) td:hover {
            background-color: fuchsia;
        }

        tr:nth-child(odd) td:hover {
            background-color: seagreen;
        }

        tr:hover th:first-child {
            background-color: purple;
        }

        /* ======== ESTILOS DEL FORMULARIO ======== */

        form {
            width: 400px;
            margin: 40px auto;
            padding: 20px;
            border: 2px solid #444;
            border-radius: 10px;
            background: #f5f5f5;
        }

        fieldset {
            border: 1px solid #333;
            padding: 15px;
            margin-bottom: 20px;
        }

        legend {
            font-weight: bold;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 95%;
            padding: 6px;
            margin-top: 5px;
        }

        input[type="submit"],
        input[type="reset"] {
            width: 48%;
            margin-top: 15px;
            cursor: pointer;
        }

        /* ======== TUS NUEVOS ESTILOS AÑADIDOS ======== */

        input:focus {
            background-color: red;
            outline: none;
        }

        input[type="radio"]:checked+label {
            color: red;
        }
    </style>
</head>

<body>

    <h1 style="text-align:center;">Ejemplo de Tabla y Formulario</h1>

    <!-- ================= TABLA ================= -->
    <table summary="Tabla de canciones con puntuación">
        <caption><strong>Clasificación de Canciones</strong></caption>

        <thead>
            <tr>
                <th>Canción</th>
                <th>Autor</th>
                <th>Puntuación</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Malamente</td>
                <td>Rosalía</td>
                <td>2</td>
            </tr>

            <tr>
                <td rowspan="2">En Un Mercedes Blanco</td>
                <td>Kiko Veneno</td>
                <td>10</td>
            </tr>
            <tr>
                <td>10</td>
            </tr>

            <tr>
                <td>La noche de anoche</td>
                <td>Bad Bunny</td>
                <td>0</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Tabla elaborada como ejemplo del temario</td>
            </tr>
        </tfoot>
    </table>

    <!-- ================= FORMULARIO ================= -->
    <form action="#" method="POST" autocomplete="on">

        <fieldset>
            <legend>Datos personales</legend>

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Escribe tu nombre">

            <label for="edad">Edad</label>
            <input type="number" id="edad" name="edad" min="0" max="99" step="1">

            <label for="fnac">Fecha de nacimiento</label>
            <input type="date" id="fnac" name="fnac" min="1900-01-01" max="2025-12-31">
        </fieldset>

        <fieldset>
            <legend>Preferencias</legend>

            <label>Género</label><br>

            <input type="radio" name="genero" value="M" id="genM">
            <label for="genM">Masculino</label>

            <input type="radio" name="genero" value="F" id="genF">
            <label for="genF">Femenino</label>

            <input type="radio" name="genero" value="O" id="genO">
            <label for="genO">Otro</label>

            <label for="prov">Provincia</label>
            <select id="prov" name="prov">
                <option value="SE">Sevilla</option>
                <option value="CA">Cádiz</option>
                <option value="HU">Huelva</option>
            </select>

            <label for="coment">Comentarios</label>
            <textarea id="coment" name="coment" rows="4">Escribe algo...</textarea>
        </fieldset>

        <input type="submit" value="Enviar">
        <input type="reset" value="Borrar">
    </form>

</body>

</html>
