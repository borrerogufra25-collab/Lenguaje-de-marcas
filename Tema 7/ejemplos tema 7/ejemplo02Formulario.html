<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Crea tu cuenta</h4>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">

                                <label for="nombre" class="form-label">Nombre completo</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Juan Pérez">
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="email" placeholder="nombre@ejemplo.com">
                                <div class="form-text">Nunca compartiremos tu correo con terceros.</div>
                            </div>

                            <div class="mb-3">
                                <label for="pais" class="form-label">País</label>
                                <select class="form-select" id="pais">
                                    <option selected>Selecciona tu país...</option>
                                    <option value="1">España</option>
                                    <option value="2">México</option>
                                    <option value="3">Argentina</option>
                                    <option value="4">Otro</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label d-block">Preferencia de contacto</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="contacto" id="radio1"
                                        value="email">
                                    <label class="form-check-label" for="radio1">Email</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="contacto" id="radio2"
                                        value="telefono">
                                    <label class="form-check-label" for="radio2">Teléfono</label>
                                </div>
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="terminos">
                                <label class="form-check-label" for="terminos">Acepto los términos y condiciones</label>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Registrarse</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <form action="#" method=" post" id="formulario"></form>
    <label for="nombre">Nombre</label>
    <input type="text" name="nombre" id="nombre">

</body>

</html>
