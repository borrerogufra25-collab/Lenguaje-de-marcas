<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>

<body>

    <form name="ejercicio_1" method="post" autocomplete="on"></form>

    <legend>Datos personales</legend>

    <label for="nombre">* Nombre</label>
    <input type="text" id="nombre" name="nombre" required autocomplete="on" pattern="[A-Za-z]{3,20}">

    <br>

    <label for="apellido">* Apellidos</label>
    <input type="text" id="apellido" name="apellido" required autocomplete="on" pattern="[A-Za-z]{3,20}">

    <br>

    <label for="edad">Edad</label>
    <input type="number" id="edad" name="edad" min="0" max="120" step="1">

    <br>

    <label for="email">Email</label>
    <input type="text">

    <br>

    <label for="navegador">Su navegador favorito</label>
    <input type="text">

</body>

</html>
